<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>DevOps Task Board</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1120;
        color: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background: radial-gradient(ellipse at top, #172554 0, #0b1120 55%);
      }

      main { width: min(100%, 720px); margin: 0 auto; }
      .eyebrow { color: #60a5fa; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 10px 0 8px; color: #f9fafb; font-size: clamp(2rem, 7vw, 3.2rem); }
      .intro { margin: 0 0 28px; color: #9ca3af; }
      .panel { padding: 24px; border: 1px solid #263449; border-radius: 18px; background: rgb(17 24 39 / 88%); box-shadow: 0 24px 70px rgb(0 0 0 / 25%); }
      .stats { display: flex; gap: 12px; margin-bottom: 22px; }
      .stat { flex: 1; padding: 14px; border-radius: 12px; background: #111c30; color: #9ca3af; font-size: .88rem; }
      .stat strong { display: block; margin-top: 4px; color: #f9fafb; font-size: 1.4rem; }
      form { display: flex; gap: 10px; }
      input { min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid #334155; border-radius: 10px; outline: none; background: #0b1120; color: #f9fafb; font: inherit; }
      input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgb(96 165 250 / 15%); }
      button { padding: 11px 15px; border: 0; border-radius: 10px; background: #2563eb; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:hover { background: #3b82f6; }
      button:focus-visible, a:focus-visible { outline: 2px solid #93c5fd; outline-offset: 3px; }
      ul { display: grid; gap: 9px; margin: 20px 0 0; padding: 0; list-style: none; }
      li { display: flex; align-items: center; gap: 12px; padding: 13px; border: 1px solid #263449; border-radius: 11px; background: #0f172a; }
      li input { flex: 0 0 auto; width: 18px; height: 18px; accent-color: #3b82f6; }
      .task-title { flex: 1; overflow-wrap: anywhere; }
      li.completed .task-title { color: #6b7280; text-decoration: line-through; }
      .delete { padding: 7px 10px; background: #374151; font-size: .85rem; }
      .delete:hover { background: #b91c1c; }
      .empty, .error { padding: 22px 10px; color: #9ca3af; text-align: center; }
      .error { color: #fca5a5; }
      .links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 22px; }
      a { color: #93c5fd; font-size: .9rem; }
      @media (max-width: 520px) {
        body { padding: 28px 14px; }
        .panel { padding: 17px; }
        form { align-items: stretch; flex-direction: column; }
        form button { padding: 13px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Projet de démonstration DevOps</p>
      <h1>Task Board</h1>
      <p class="intro">Organisez vos tâches et observez l’activité de l’application.</p>

      <section class="panel" aria-label="Gestion des tâches">
        <div class="stats" aria-live="polite">
          <div class="stat">Total<strong id="total">0</strong></div>
          <div class="stat">Terminées<strong id="completed">0</strong></div>
        </div>
        <form id="task-form">
          <input id="task-title" name="title" maxlength="200" placeholder="Ex. recuperons une tâche pour tester" aria-label="Titre de la tâche" required>
          <button type="submit">Ajouter une tâche</button>
        </form>
        <ul id="tasks" aria-live="polite"></ul>
        <div class="links">
          <a href="/api/tasks" target="_blank" rel="noreferrer">API JSON</a>
          <a href="/metrics" target="_blank" rel="noreferrer">Métriques Prometheus</a>
        </div>
      </section>
    </main>
    <script>
      const taskList = document.querySelector("#tasks");
      const form = document.querySelector("#task-form");
      const titleInput = document.querySelector("#task-title");

      async function request(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || `Erreur HTTP ${response.status}`);
        }
        return response.status === 204 ? null : response.json();
      }

      function showError(message) {
        taskList.replaceChildren();
        const error = document.createElement("li");
        error.className = "error";
        error.textContent = message;
        taskList.append(error);
      }

      async function loadTasks() {
        try {
          const tasks = await request("/api/tasks");
          document.querySelector("#total").textContent = tasks.length;
          document.querySelector("#completed").textContent = tasks.filter((task) => task.completed).length;
          taskList.replaceChildren();

          if (tasks.length === 0) {
            const empty = document.createElement("li");
            empty.className = "empty";
            empty.textContent = "Aucune tâche pour le moment.";
            taskList.append(empty);
            return;
          }

          for (const task of tasks) {
            const item = document.createElement("li");
            item.className = task.completed ? "completed" : "";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.setAttribute("aria-label", `Marquer « ${task.title} » comme ${task.completed ? "à faire" : "terminée"}`);
            checkbox.addEventListener("change", async () => {
              try {
                await request(`/api/tasks/${encodeURIComponent(task.id)}`, {
                  method: "PATCH",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ completed: checkbox.checked }),
                });
                await loadTasks();
              } catch (error) {
                showError(error.message);
              }
            });

            const label = document.createElement("span");
            label.className = "task-title";
            label.textContent = task.title;

            const remove = document.createElement("button");
            remove.className = "delete";
            remove.type = "button";
            remove.textContent = "Supprimer";
            remove.setAttribute("aria-label", `Supprimer « ${task.title} »`);
            remove.addEventListener("click", async () => {
              try {
                await request(`/api/tasks/${encodeURIComponent(task.id)}`, { method: "DELETE" });
                await loadTasks();
              } catch (error) {
                showError(error.message);
              }
            });

            item.append(checkbox, label, remove);
            taskList.append(item);
          }
        } catch (error) {
          showError(error.message);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          await request("/api/tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: titleInput.value }),
          });
          titleInput.value = "";
          await loadTasks();
          titleInput.focus();
        } catch (error) {
          showError(error.message);
        }
      });

      loadTasks();
    </script>
  </body>
</html>
